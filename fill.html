<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>מערכת פגישונים</title>
    <link rel="stylesheet" href="./pg_files/general-pages.css">
    <link rel="stylesheet" href="./pg_files/app.rtl.css">
    <link rel="stylesheet" href="./pg_files/app-dark.rtl.css">
    <link rel="stylesheet" href="./pg_files/app-custom.css">
    <link rel="stylesheet" href="./pg_files/app-dark-custom.css">
    <link rel="stylesheet" href="./pg_files/app-fonts-override.css">
    <link rel="stylesheet" href="./pg_files/certifications.css">
    <link rel="icon" type="image/x-icon" href="https://pgishonim.com/M/assets/images/favicon.ico?v=1788903552">
    <meta name="theme-color" content="#223e9c">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="פגישונים">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        .setup-form { padding: 22px; }
        .setup-form .form-label { font-weight: 600; margin-bottom: 4px; }
        .setup-form .form-control, .setup-form .form-select { font-size: 1rem; }
        .setup-form .row { --bs-gutter-x: 14px; }
        .time-field .form-label { display:block; text-align:center; font-size:1.05rem; margin-bottom:10px; }
        .time-picker { display:flex; align-items:center; justify-content:center; gap:12px; background:linear-gradient(135deg,#eef4ff,#f7faff); border:1px solid #d7e3f8; border-radius:16px; padding:16px; }
        .time-sel { -webkit-appearance:none; appearance:none; text-align:center; text-align-last:center; width:auto; min-width:92px; font-size:1.7rem; font-weight:700; color:#223e9c; background:#fff; border:2px solid #cdddf6; border-radius:12px; padding:10px 16px; box-shadow:0 2px 6px rgba(34,62,156,.08); }
        .time-sel:focus { outline:none; border-color:#3b5fc7; box-shadow:0 0 0 3px rgba(59,95,199,.18); }
        .time-colon { font-size:2rem; font-weight:800; color:#223e9c; }
    </style>
    <script>
        function pgGo(url){ window.location.href = url; return false; }
    </script>
</head>
<body class="">
<div class="exit-pass-page ext-page">
    <div class="exit-pass-card">
        <div class="exit-pass-header">
            <div>
                <h1 class="exit-pass-title">יצירת אישור יציאה</h1>
                <div class="exit-pass-subtitle">מילוי פרטי התלמיד והאישור</div>
            </div>
            <div class="exit-pass-brand">
                <img src="./pg_files/logo_pgishonim_full_white.png" alt="pgishonim">
            </div>
        </div>
        <div class="exit-pass-body">
            <form id="setupForm" class="setup-form" novalidate>
                <div class="row">
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_student">שם התלמיד</label>
                        <input type="text" id="f_student" class="form-control" placeholder="שם מלא" required>
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_klass">כיתה</label>
                        <input type="text" id="f_klass" class="form-control" placeholder="לדוגמה: י3">
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_date">תאריך</label>
                        <input type="date" id="f_date" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_reason">סיבה</label>
                        <input type="text" id="f_reason" class="form-control" placeholder="סיבת היציאה">
                    </div>
                    <div class="col-12 mb-3 time-field">
                        <label class="form-label">באיזו שעה לצאת?</label>
                        <div class="time-picker">
                            <select id="f_hour" class="time-sel" aria-label="שעה"></select>
                            <span class="time-colon">:</span>
                            <select id="f_min" class="time-sel" aria-label="דקות"></select>
                        </div>
                    </div>
                </div>
                <div class="d-grid mt-2">
                    <button type="submit" class="btn btn-success btn-lg">צור אישור והמשך</button>
                </div>
                <div class="pass-footer mt-3" style="text-align:center; color:var(--muted);">הפרטים נשמרים במכשיר ומוצגים באישור</div>
            </form>
        </div>
    </div>
</div>
<script>
    (function(){
        var DEFAULTS = {
            student: 'ישראל ישראלי', klass: 'י3', date: '', time: '11:26',
            reason: 'סיים בית ספר', taz: ''
        };
        function pad(n){ return (n<10?'0':'')+n; }
        function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
        function displayToISO(s){ // dd/mm/yyyy -> yyyy-mm-dd
            if(!s) return todayISO();
            var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? (m[3]+'-'+m[2]+'-'+m[1]) : todayISO();
        }
        function isoToDisplay(s){ // yyyy-mm-dd -> dd/mm/yyyy
            if(!s) return ''; var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? (m[3]+'/'+m[2]+'/'+m[1]) : s;
        }
        var saved = {}; try { saved = JSON.parse(localStorage.getItem('pg_passData') || '{}') || {}; } catch(e){}
        function g(k){ return (saved[k]!=null && saved[k]!=='') ? saved[k] : DEFAULTS[k]; }

        document.getElementById('f_student').value = g('student');
        document.getElementById('f_klass').value = g('klass');
        document.getElementById('f_date').value = saved.date ? displayToISO(saved.date) : todayISO();
        document.getElementById('f_reason').value = g('reason');

        // Time picker: hours 00-23, minutes in 5-minute steps, default to the current time
        var hSel = document.getElementById('f_hour'), mSel = document.getElementById('f_min'), i, o;
        for (i = 0; i < 24; i++) { o = document.createElement('option'); o.value = ('0'+i).slice(-2); o.textContent = ('0'+i).slice(-2); hSel.appendChild(o); }
        for (i = 0; i < 60; i += 5) { o = document.createElement('option'); o.value = ('0'+i).slice(-2); o.textContent = ('0'+i).slice(-2); mSel.appendChild(o); }
        (function () {
            var savedT = (saved.time && /^\d{2}:\d{2}$/.test(saved.time)) ? saved.time.split(':') : null;
            var nd = new Date();
            var hh = savedT ? savedT[0] : ('0' + nd.getHours()).slice(-2);
            var mm = savedT ? savedT[1] : ('0' + Math.min(55, Math.round(nd.getMinutes() / 5) * 5)).slice(-2);
            hSel.value = hh;
            // snap minutes to the nearest available 5-min option
            mSel.value = ('0' + (Math.min(55, Math.round(parseInt(mm, 10) / 5) * 5))).slice(-2);
        })();

        document.getElementById('setupForm').addEventListener('submit', function(e){
            e.preventDefault();
            function v(id){ return (document.getElementById(id).value || '').trim(); }
            var prev = {}; try { prev = JSON.parse(localStorage.getItem('pg_passData') || '{}') || {}; } catch(e){}
            var data = {
                student: v('f_student'), klass: v('f_klass'),
                date: isoToDisplay(v('f_date')),
                time: document.getElementById('f_hour').value + ':' + document.getElementById('f_min').value,
                reason: v('f_reason'),
                taz: prev.taz || ''
            };
            try { localStorage.setItem('pg_passData', JSON.stringify(data)); } catch(err){}
            pgGo('page2.html');
        });
    })();
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function () {});
        });
    }
</script>
</body>
</html>
