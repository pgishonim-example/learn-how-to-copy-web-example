<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>כניסה · מערכת פגישונים</title>
    <link rel="icon" type="image/x-icon" href="https://pgishonim.com/M/assets/images/favicon.ico?v=1788903552">
    <meta name="theme-color" content="#223e9c">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        *{ box-sizing:border-box; }
        html,body{ height:100%; margin:0; }
        body{
            background:linear-gradient(180deg,#223e9c,#17295f);
            font-family:'Rubik','Segoe UI',Arial,sans-serif; color:#1b2336;
            display:flex; align-items:center; justify-content:center; padding:16px;
            -webkit-text-size-adjust:100%;
        }
        .card{ background:#fff; width:100%; max-width:420px; border-radius:22px;
            box-shadow:0 24px 70px rgba(0,0,0,.45); overflow:hidden; }
        .top{ background:linear-gradient(135deg,#223e9c,#3457c9); color:#fff; padding:26px 24px; text-align:center; }
        .top .logo{ font-size:2rem; }
        .top h1{ margin:8px 0 4px; font-size:1.4rem; font-weight:800; }
        .top p{ margin:0; opacity:.9; font-size:.9rem; }
        form{ padding:24px; }
        label{ display:block; font-weight:600; font-size:.9rem; margin:0 0 6px; }
        input{ width:100%; padding:13px 14px; margin:0 0 16px; font-size:1rem;
            border:1px solid #d7deec; border-radius:12px; background:#f7f9fd; color:#1b2336; }
        input:focus{ outline:none; border-color:#3457c9; background:#fff; }
        .btn{ width:100%; border:none; border-radius:13px; padding:15px; font-size:1.08rem;
            font-weight:800; color:#fff; background:#18a76c; cursor:pointer; box-shadow:0 10px 24px rgba(24,167,108,.32); }
        .btn:disabled{ background:#c3cad8; box-shadow:none; cursor:wait; }
        .msg{ min-height:1.3em; margin:14px 2px 0; text-align:center; font-size:.9rem; color:#c62f3b; font-weight:600; }
        .note{ margin:16px 0 0; text-align:center; font-size:.8rem; color:#8a93a6; line-height:1.5; }
    </style>
</head>
<body>
<!-- Device access gate: covers everything in black until the device is verified as approved. -->
<div id="pgGate" aria-hidden="true" style="position:fixed;inset:0;background:#000;z-index:2147483647;display:flex;align-items:center;justify-content:center;">
  <div id="pgGateInfo" style="display:none;text-align:center;padding:26px;max-width:340px;">
    <div style="color:#777;font:600 14px/1.6 Rubik,Arial,sans-serif;">הגישה ממכשיר זה אינה מאושרת.</div>
    <div style="color:#555;font:600 12px/1.6 Rubik,Arial,sans-serif;margin-top:14px;">קוד המכשיר:</div>
    <div id="pgGateCode" dir="ltr" style="color:#8a8a8a;font:700 15px/1.4 monospace;margin-top:4px;word-break:break-all;"></div>
    <div style="color:#666;font:400 12px/1.6 Rubik,Arial,sans-serif;margin-top:12px;">הצג/י קוד זה למנהל כדי לקבל גישה.</div>
    <a href="#" id="pgGateAdmin" style="color:#3a3a3a;font:600 11px Rubik,Arial,sans-serif;margin-top:28px;display:inline-block;">כניסת מנהל</a>
  </div>
</div>
<div class="card">
    <div class="top">
        <div class="logo">🔐</div>
        <h1>כניסה למערכת</h1>
        <p>יש להזין שם חשבון וסיסמה כדי להמשיך</p>
    </div>
    <form id="loginForm" autocomplete="on">
        <label for="accName">שם חשבון</label>
        <input id="accName" type="text" autocomplete="username" required placeholder="שם החשבון שלך">
        <label for="accPass">סיסמה</label>
        <input id="accPass" type="password" autocomplete="current-password" required placeholder="סיסמה">
        <button class="btn" id="loginBtn" type="submit">כניסה</button>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <p class="note">אין לך חשבון? אפשר לפנות אלינו במייל כדי לקבל שם חשבון וסיסמה, או לכל שאלה:<br>
          <a href="mailto:rainbet5559@gmail.com?subject=בקשה%20לחשבון%20-%20מערכת%20פגישונים" style="color:#223e9c;font-weight:700;text-decoration:none;direction:ltr;display:inline-block;margin-top:4px;">✉️ rainbet5559@gmail.com</a></p>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-client.js"></script>
<script>
(function () {
    "use strict";
    var ADMIN_UID = "EJCy00GeZcR9PSbE994Oe9un7Tn2"; // dsthegoat = owner/admin
    var form = document.getElementById("loginForm");
    var msg  = document.getElementById("msg");
    var btn  = document.getElementById("loginBtn");
    var routed = false;
    // If the user just logged out, don't silently sign them back in from the saved session.
    var forceLogout = false;
    try { forceLogout = localStorage.getItem("pg_logout") === "1"; if (forceLogout) { localStorage.removeItem("pg_logout"); } } catch (e) {}

    function reset() { routed = false; btn.disabled = false; btn.textContent = "כניסה"; }

    // Stable per-phone id (kept in this browser only) used to lock an account to one device.
    function pgDeviceId() {
        var k = "pg_device_id", id = "";
        try { id = localStorage.getItem(k) || ""; } catch (e) {}
        if (!id) { id = Date.now().toString(36) + Math.random().toString(36).slice(2, 10); try { localStorage.setItem(k, id); } catch (e) {} }
        return id;
    }

    var devId = pgDeviceId();
    var deviceAllowed = false;

    // Device access gate. Only phones the admin approved (listed under RTDB /allowed_devices)
    // get past the black screen to the login form. Reads publicly (no login yet) via REST.
    function pgGateCheck() {
        var gate = document.getElementById("pgGate");
        var info = document.getElementById("pgGateInfo");
        var codeEl = document.getElementById("pgGateCode");
        var adminLink = document.getElementById("pgGateAdmin");
        if (codeEl) { codeEl.textContent = devId; }
        if (adminLink) { adminLink.onclick = function (e) { e.preventDefault(); if (gate) { gate.style.display = "none"; } }; }
        function allow(resolve) { deviceAllowed = true; if (gate) { gate.style.display = "none"; } resolve(true); }
        function deny(resolve) { deviceAllowed = false; if (info) { info.style.display = "block"; } resolve(false); }
        return new Promise(function (resolve) {
            var base = "";
            try { base = (window.FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL ? FIREBASE_CONFIG.databaseURL : "").replace(/\/$/, ""); } catch (e) {}
            if (!base) { allow(resolve); return; } // can't check → don't brick
            fetch(base + "/allowed_devices/" + encodeURIComponent(devId) + ".json")
                .then(function (r) { return r.ok ? r.json().then(function (v) { return { ok: true, v: v }; }) : { ok: false }; })
                .then(function (res) {
                    if (!res.ok) { allow(resolve); return; }   // rules not set up yet (permission denied) → fail OPEN, don't lock anyone out
                    if (res.v) { allow(resolve); } else { deny(resolve); } // listed → allowed, not listed → black screen
                })
                .catch(function () { deny(resolve); }); // network error → stay black (admin link still works)
        });
    }
    var gateReady = pgGateCheck();

    function route(user) {
        if (routed) return;
        routed = true;
        var uid = user.uid;
        try { sessionStorage.setItem("pg_uid", uid); } catch (e) {}
        if (uid === ADMIN_UID) {
            try { sessionStorage.setItem("pg_auth_ok", "1"); sessionStorage.setItem("pg_admin", "1"); } catch (e) {}
            // The admin's own phone is always allowed — self-approve so the gate can never lock the admin out.
            try {
                window.PG_FIREBASE.database.ref("allowed_devices/" + devId).set({ label: "מנהל", at: Date.now() })
                    .then(function () { window.location.replace("manage.html"); })
                    .catch(function () { window.location.replace("manage.html"); });
            } catch (e) { window.location.replace("manage.html"); }
            return;
        }
        // Regular user: must have an active account record created by the admin.
        window.PG_FIREBASE.database.ref("accounts/" + uid).once("value").then(function (snap) {
            var acc = snap.val();
            if (!acc || acc.disabled) {
                msg.textContent = "החשבון אינו פעיל. פנה/י למנהל המערכת.";
                window.PG_FIREBASE.auth.signOut();
                reset();
                return;
            }
            // Device must be approved by the admin (same gate as the black screen).
            if (!deviceAllowed) {
                window.PG_FIREBASE.auth.signOut();
                reset();
                var g = document.getElementById("pgGate");
                if (g) { g.style.display = "flex"; var gi = document.getElementById("pgGateInfo"); if (gi) { gi.style.display = "block"; } }
                return;
            }
            // One account = one phone. The FIRST device to log in claims it; others are refused.
            var myDev = pgDeviceId();
            var bound = acc.deviceId || "";
            if (bound && bound !== myDev) {
                msg.textContent = "החשבון הזה כבר בשימוש במכשיר אחר. פנה/י למנהל כדי לשחרר אותו.";
                window.PG_FIREBASE.auth.signOut();
                reset();
                return;
            }
            function enter() {
                try {
                    sessionStorage.setItem("pg_auth_ok", "1");
                    sessionStorage.setItem("pg_tos_ok", "1"); // Terms page removed — skip straight into the app
                    try { sessionStorage.removeItem("pg_admin"); } catch (e) {}
                    sessionStorage.setItem("pg_name", acc.name || "");
                    sessionStorage.setItem("pg_max", String(acc.maxExits == null ? 0 : acc.maxExits));
                    sessionStorage.setItem("pg_used", String(acc.exitsUsed || 0));
                } catch (e) {}
                window.location.replace("guide.html");
            }
            if (!bound) {
                window.PG_FIREBASE.database.ref("accounts/" + uid + "/deviceId").set(myDev).then(enter).catch(enter);
            } else {
                enter();
            }
        }).catch(function () {
            msg.textContent = "לא ניתן לאמת את החשבון כעת. נסו שוב.";
            window.PG_FIREBASE.auth.signOut();
            reset();
        });
    }

    if (!window.PG_FIREBASE) {
        msg.textContent = "שירות הכניסה לא נטען. בדקו את חיבור האינטרנט ורעננו.";
        btn.disabled = true;
        return;
    }

    // Already signed in on this device → route automatically (unless the user just logged out).
    window.PG_FIREBASE.auth.onAuthStateChanged(function (user) {
        if (forceLogout) {
            if (user) { try { window.PG_FIREBASE.auth.signOut(); } catch (e) {} }
            forceLogout = false; // only suppress the first auto-route after logout
            return;
        }
        if (user && !routed) { gateReady.then(function () { route(user); }); }
    });

    form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var name = document.getElementById("accName").value;
        var pass = document.getElementById("accPass").value;
        if (!name || !name.trim()) { msg.textContent = "יש להזין שם חשבון."; return; }
        if (!pass) { msg.textContent = "יש להזין סיסמה."; return; }
        btn.disabled = true; btn.textContent = "בודק…"; msg.textContent = "";
        var email = window.pgAccountToEmail(name);
        window.PG_FIREBASE.auth.signInWithEmailAndPassword(email, pass)
            .then(function (cred) { route(cred.user); })
            .catch(function () { msg.textContent = "שם חשבון או סיסמה שגויים."; reset(); });
    });
})();
</script>
</body>
</html>
