<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>מערכת פגישונים</title>
    <link rel="stylesheet" href="./מערכת פגישונים_files/general-pages.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app.rtl.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app-dark.rtl.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app-custom.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app-dark-custom.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app-fonts-override.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/certifications.css">
    <link rel="icon" type="image/x-icon" href="https://pgishonim.com/M/assets/images/favicon.ico?v=1788903552">
    <meta name="theme-color" content="#223e9c">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="פגישונים">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        .setup-form { padding: 22px; }
        .setup-form .form-label { font-weight: 600; margin-bottom: 4px; }
        .setup-form .form-control, .setup-form .form-select { font-size: 1rem; }
        .setup-form .row { --bs-gutter-x: 14px; }
    </style>
    <script>
        function pgGo(url){ window.location.href = url; return false; }
    </script>
</head>
<body class="">
<div class="exit-pass-page ext-page">
    <div class="exit-pass-card">
        <div class="exit-pass-header">
            <div>
                <h1 class="exit-pass-title">יצירת אישור יציאה</h1>
                <div class="exit-pass-subtitle">מילוי פרטי התלמיד והאישור</div>
            </div>
            <div class="exit-pass-brand">
                <img src="./מערכת פגישונים_files/logo_pgishonim_full_white.png" alt="pgishonim">
            </div>
        </div>
        <div class="exit-pass-body">
            <form id="setupForm" class="setup-form" novalidate>
                <div class="row">
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_student">שם התלמיד</label>
                        <input type="text" id="f_student" class="form-control" placeholder="שם מלא" required>
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_klass">כיתה</label>
                        <input type="text" id="f_klass" class="form-control" placeholder="לדוגמה: י3">
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_date">תאריך</label>
                        <input type="date" id="f_date" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_time">שעה</label>
                        <input type="time" id="f_time" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_reason">סיבה</label>
                        <input type="text" id="f_reason" class="form-control" placeholder="סיבת היציאה">
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="f_taz">תעודת זהות</label>
                        <input type="text" id="f_taz" class="form-control dir-ltr" dir="ltr" inputmode="numeric" placeholder="מספר ת״ז">
                    </div>
                </div>
                <div class="d-grid mt-2">
                    <button type="submit" class="btn btn-success btn-lg">צור אישור והמשך</button>
                </div>
                <div class="pass-footer mt-3" style="text-align:center; color:var(--muted);">הפרטים נשמרים במכשיר ומוצגים באישור</div>
            </form>
        </div>
    </div>
</div>
<script>
    (function(){
        var DEFAULTS = {
            student: 'דורי שגיא', klass: 'י3', date: '', time: '11:26',
            reason: 'סיים בית ספר', taz: ''
        };
        function pad(n){ return (n<10?'0':'')+n; }
        function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
        function displayToISO(s){ // dd/mm/yyyy -> yyyy-mm-dd
            if(!s) return todayISO();
            var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? (m[3]+'-'+m[2]+'-'+m[1]) : todayISO();
        }
        function isoToDisplay(s){ // yyyy-mm-dd -> dd/mm/yyyy
            if(!s) return ''; var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? (m[3]+'/'+m[2]+'/'+m[1]) : s;
        }
        var saved = {}; try { saved = JSON.parse(localStorage.getItem('pg_passData') || '{}') || {}; } catch(e){}
        function g(k){ return (saved[k]!=null && saved[k]!=='') ? saved[k] : DEFAULTS[k]; }

        document.getElementById('f_student').value = g('student');
        document.getElementById('f_klass').value = g('klass');
        document.getElementById('f_date').value = saved.date ? displayToISO(saved.date) : todayISO();
        document.getElementById('f_time').value = g('time');
        document.getElementById('f_reason').value = g('reason');
        document.getElementById('f_taz').value = g('taz');

        document.getElementById('setupForm').addEventListener('submit', function(e){
            e.preventDefault();
            function v(id){ return (document.getElementById(id).value || '').trim(); }
            var data = {
                student: v('f_student'), klass: v('f_klass'),
                date: isoToDisplay(v('f_date')), time: v('f_time'),
                reason: v('f_reason'),
                taz: v('f_taz')
            };
            try { localStorage.setItem('pg_passData', JSON.stringify(data)); } catch(err){}
            pgGo('מערכת פגישונים.html');
        });
    })();
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function () {});
        });
    }
</script>
</body>
</html>
