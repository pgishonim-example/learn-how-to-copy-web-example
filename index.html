<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>מערכת פגישונים</title>
    <link rel="stylesheet" href="./מערכת פגישונים_files/general-pages.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app.rtl.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app-dark.rtl.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app-custom.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app-dark-custom.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/app-fonts-override.css">
    <link rel="stylesheet" href="./מערכת פגישונים_files/certifications.css">
    <link rel="icon" type="image/x-icon" href="https://pgishonim.com/M/assets/images/favicon.ico?v=1788903552">
    <meta name="theme-color" content="#223e9c">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="פגישונים">
    <style>
        .start-body { padding: 22px; }
        .start-body .form-label { font-weight: 600; }
        #remainBox { font-size: 1.5rem; }
        #remainBox b { color: #18a76c; font-size: 2rem; }
        .hist-row { display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid #eee; border-radius:10px; margin-bottom:8px; background:#fafbfc; }
        .hist-when { font-weight:600; color:#223e9c; }
        .hist-reason { color:#555; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="">
<div class="exit-pass-page ext-page">
    <div class="exit-pass-card">
        <div class="exit-pass-header">
            <div>
                <h1 class="exit-pass-title">אישור יציאה</h1>
                <div class="exit-pass-subtitle">הזינו סיסמה כדי להמשיך</div>
            </div>
            <div class="exit-pass-brand">
                <img src="./מערכת פגישונים_files/logo_pgishonim_full_white.png" alt="pgishonim">
            </div>
        </div>
        <div class="exit-pass-body">
            <div id="setupNotice" class="alert alert-warning" style="display:none; margin:16px;">
                המערכת עדיין לא חוברה למסד הנתונים. יש להשלים את הגדרת Firebase.
            </div>

            <div id="pwStep" class="start-body">
                <div class="alert alert-info text-center">הזינו את הסיסמה האישית שלכם</div>
                <input type="text" id="pw" class="form-control form-control-lg" placeholder="הקלידו סיסמה" autocomplete="off" dir="rtl">
                <div class="d-grid mt-3">
                    <button id="pwBtn" class="btn btn-success btn-lg">המשך</button>
                </div>
                <div id="pwErr" class="text-danger text-center mt-3 fw-bold" style="display:none"></div>
            </div>

            <div id="resStep" class="start-body" style="display:none">
                <h2 id="hello" class="text-center mb-2"></h2>
                <div id="remainBox" class="text-center my-2"></div>
                <div id="usedBox" class="text-center mb-3" style="color:#888;"></div>
                <div id="proceedWrap" class="d-grid">
                    <button id="proceedBtn" class="btn btn-success btn-lg">צור אישור יציאה</button>
                </div>
                <div id="blockedBox" class="alert alert-danger text-center" style="display:none">
                    ניצלתם את כל היציאות שלכם. לא ניתן ליצור אישור נוסף.
                </div>
                <div id="historyWrap" class="mt-4" style="display:none">
                    <h5 class="mb-2">היסטוריית יציאות</h5>
                    <div id="historyList"></div>
                </div>
                <div class="text-center mt-3"><a href="#" id="backLink">חזרה / החלפת משתמש</a></div>
            </div>

            <div class="pass-footer" style="text-align:center; padding:12px;">
                <a href="settings.html">הגדרות מנהל</a>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        var cfg = window.firebaseConfig || {};
        var connected = cfg.apiKey && cfg.apiKey.indexOf('PASTE') === -1;
        var db = null;
        if (connected) {
            try { firebase.initializeApp(cfg); db = firebase.firestore(); }
            catch (e) { connected = false; }
        }
        if (!connected) { document.getElementById('setupNotice').style.display = 'block'; }

        var pwBtn = document.getElementById('pwBtn');
        var pwInput = document.getElementById('pw');

        function showErr(m) { var e = document.getElementById('pwErr'); e.textContent = m; e.style.display = 'block'; }
        function clearErr() { document.getElementById('pwErr').style.display = 'none'; }

        function lookup() {
            var pw = (pwInput.value || '').trim();
            clearErr();
            if (!pw) { showErr('יש להזין סיסמה'); return; }
            if (!connected) { showErr('המערכת עדיין לא חוברה למסד הנתונים'); return; }
            pwBtn.disabled = true; pwBtn.textContent = 'בודק...';
            db.collection('students').doc(pw).get()
                .then(function (doc) {
                    pwBtn.disabled = false; pwBtn.textContent = 'המשך';
                    if (!doc.exists) { showErr('סיסמה שגויה'); return; }
                    var s = doc.data();
                    var remaining = (Number(s.maxLeaves) || 0) - (Number(s.usedLeaves) || 0);
                    showResult(pw, s, remaining, pw);
                })
                .catch(function () { pwBtn.disabled = false; pwBtn.textContent = 'המשך'; showErr('שגיאת חיבור למסד הנתונים'); });
        }

        function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

        function showResult(id, s, remaining, pw) {
            document.getElementById('pwStep').style.display = 'none';
            document.getElementById('resStep').style.display = 'block';
            document.getElementById('hello').textContent = 'שלום ' + (s.name || '');
            document.getElementById('remainBox').innerHTML = 'נותרו לך <b>' + Math.max(0, remaining) + '</b> יציאות';
            var used = Number(s.usedLeaves) || 0, max = Number(s.maxLeaves) || 0;
            document.getElementById('usedBox').textContent = 'ניצלת ' + used + ' מתוך ' + max;

            var exits = (s.exits || []).slice().reverse();
            var hWrap = document.getElementById('historyWrap');
            var hList = document.getElementById('historyList');
            if (exits.length) {
                hWrap.style.display = 'block';
                hList.innerHTML = exits.map(function (x) {
                    return '<div class="hist-row"><span class="hist-when">' + esc(x.date || '') + ' · ' + esc(x.time || '') + '</span>'
                        + '<span class="hist-reason">' + esc(x.reason || '') + '</span></div>';
                }).join('');
            } else {
                hWrap.style.display = 'none';
            }

            var proceedWrap = document.getElementById('proceedWrap');
            var blockedBox = document.getElementById('blockedBox');
            if (remaining > 0) {
                proceedWrap.style.display = '';
                blockedBox.style.display = 'none';
                document.getElementById('proceedBtn').onclick = function () {
                    try {
                        localStorage.setItem('pg_passData', JSON.stringify({
                            student: s.name || '', klass: s.class || '', taz: pw
                        }));
                    } catch (e) {}
                    window.location.href = 'fill.html';
                };
            } else {
                proceedWrap.style.display = 'none';
                blockedBox.style.display = 'block';
            }
        }

        pwBtn.onclick = lookup;
        pwInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') lookup(); });
        document.getElementById('backLink').onclick = function (e) {
            e.preventDefault();
            document.getElementById('resStep').style.display = 'none';
            document.getElementById('pwStep').style.display = 'block';
            clearErr(); pwInput.value = '';
        };
    })();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
</script>
</body>
</html>
